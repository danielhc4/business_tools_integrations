# Archivo de configuración de Novasoft BTI

[http]
bti_http_route           =   "/BTI/v1.0/collector"

[amqp]

; bti_amqp_channel_host    =   "127.0.0.1"
bti_amqp_channel_host    =   "rabbitmq_api"
bti_amqp_channel_port    =   5672
; bti_amqp_channel_user    =   "bti_collector_user"
bti_amqp_channel_user    =   "guest"
bti_amqp_channel_pass    =   "guest"
bti_amqp_channel_vhost   =   "/"
bti_amqp_exchange_name   =   "bti.collector_exchange_"
bti_amqp_exchange_type   =   "fanout"
bti_amqp_queue_name      =   "bti.collector_queue_"
